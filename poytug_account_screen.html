<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poytug GNS — Аккаунт</title>
<style>
  :root{
    --bg-0:#000000;
    --bg-1:#1C1C1E;
    --bg-2:#2C2C2E;
    --sep:rgba(255,255,255,.09);
    --text-1:#FFFFFF;
    --text-2:#98989F;
    --text-3:#636366;
    --brand:#FF4438;
    --brand-dim:rgba(255,68,56,.14);
  }
  *{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
  html,body{margin:0;padding:0;}
  body{
    background:#000;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    color:var(--text-1);
  }

  .screen{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- nav header ---------- */
  .navbar{
    padding:20px 16px 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .nav-btn{
    width:36px;height:36px;border-radius:10px;
    background:var(--bg-1);
    display:flex;align-items:center;justify-content:center;
    color:var(--text-1);
  }
  .nav-title{ font-size:17px; font-weight:600; color:var(--text-1); }

  .content{ flex:1; padding-bottom:24px; }

  /* ---------- profile head ---------- */
  .profile-head{
    display:flex; align-items:center; gap:14px; padding:6px 20px 20px;
  }
  .avatar{
    width:60px;height:60px;border-radius:50%;
    background:var(--bg-1); border:1px solid var(--sep);
    display:flex;align-items:center;justify-content:center; color:var(--text-2);
    flex:0 0 auto;
  }
  .profile-head h2{ margin:0; font-size:19px; color:var(--text-1); font-weight:700; }
  .profile-head p{ margin:2px 0 0; font-size:13px; color:var(--text-2); }

  /* ---------- balance card ---------- */
  .balance-card{
    margin:0 20px 20px; padding:18px;
    background:linear-gradient(135deg, var(--bg-1), var(--bg-2));
    border:1px solid var(--sep); border-radius:18px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .balance-card .l{ font-size:13px; color:var(--text-2); font-weight:600; margin-bottom:4px; }
  .balance-card .v{ font-size:22px; color:var(--text-1); font-weight:750; letter-spacing:-.3px; }
  .balance-card .top-up{
    background:var(--brand); color:#fff; font-size:13px; font-weight:700;
    padding:9px 14px; border-radius:12px; white-space:nowrap;
  }

  /* ---------- section label ---------- */
  .section-label{
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    color:var(--text-3); margin:4px 24px 10px;
  }

  /* ---------- list / rows ---------- */
  .list{
    margin:0 20px 18px; background:var(--bg-1); border:1px solid var(--sep);
    border-radius:16px; overflow:hidden;
  }
  .row{
    display:flex; align-items:center; gap:12px;
    padding:13px 14px; border-bottom:1px solid var(--sep);
  }
  .row:last-child{ border-bottom:none; }
  .row .ic{
    width:32px;height:32px;border-radius:9px; background:var(--bg-2);
    display:flex;align-items:center;justify-content:center; color:var(--text-1); flex:0 0 auto;
  }
  .row .ic.danger{ color:var(--brand); background:var(--brand-dim); }
  .row .label{ font-size:15px; color:var(--text-1); font-weight:500; flex:1; }
  .row .label.danger{ color:var(--brand); }
  .row .chev{ color:var(--text-3); flex:0 0 auto; }

  .footnote{
    text-align:center; font-size:11px; color:var(--text-3); margin:10px 0 24px;
  }
</style>
</head>
<body>

  <div class="screen">

    <div class="navbar">
      <div style="width:36px"></div>
      <div class="nav-title">Аккаунт</div>
      <div class="nav-btn" aria-label="Закрыть">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </div>
    </div>

    <div class="content">

      <div class="profile-head">
        <div class="avatar">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c1.5-4.5 5-7 8-7s6.5 2.5 8 7"/>
          </svg>
        </div>
        <div>
          <h2>Гость</h2>
          <p>+998 (90) •••-••-••</p>
        </div>
      </div>

      <div class="balance-card">
        <div>
          <div class="l">Мой баланс</div>
          <div class="v">25 000 UZS</div>
        </div>
        <div class="top-up">Пополнить</div>
      </div>

      <div class="section-label">Управление</div>
      <div class="list">
        <div class="row">
          <div class="ic danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>
            </svg>
          </div>
          <div class="label danger">Безопасность</div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="row">
          <div class="ic">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
            </svg>
          </div>
          <div class="label">Настройки</div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="row">
          <div class="ic">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3v18h18M18 17V9M13 17V5M8 17v-4"/>
            </svg>
          </div>
          <div class="label">История заказов</div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>

      <div class="section-label">Информация</div>
      <div class="list">
        <div class="row">
          <div class="ic">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="2" width="16" height="20" rx="2"/>
              <path d="M9 22v-4h6v4M9 6h.01M15 6h.01M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/>
            </svg>
          </div>
          <div class="label">О нашей фирме</div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
        <div class="row">
          <div class="ic">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 11a9 9 0 0 1 18 0v5a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h3M3 11v5a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-2a2 2 0 0 0-2-2H3"/>
            </svg>
          </div>
          <div class="label">Служба поддержки</div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>

      <div class="list">
        <div class="row" style="border-bottom:none;">
          <div class="ic danger">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
            </svg>
          </div>
          <div class="label danger">Выйти из аккаунта</div>
        </div>
      </div>

      <p class="footnote">Poytug GNS v3.1 · 2FA Protected</p>

    </div>
  </div>

</body>
</html>
