<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poytug GNS — Вход</title>
<style>
  :root{
    --bg-0:#000000;
    --bg-1:#1C1C1E;
    --bg-2:#2C2C2E;
    --bg-3:#3A3A3C;
    --sep:rgba(255,255,255,.09);
    --text-1:#FFFFFF;
    --text-2:#98989F;
    --text-3:#636366;
    --brand:#FF4438;
    --brand-dim:rgba(255,68,56,.14);
  }
  *{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
  html,body{margin:0;padding:0;}
  body{
    background:#000;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
    color:var(--text-1);
  }

  .screen{
    max-width:430px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  /* ---------- nav header ---------- */
  .navbar{
    padding:20px 16px 8px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .nav-btn{
    width:36px;height:36px;border-radius:10px;
    background:var(--bg-1);
    display:flex;align-items:center;justify-content:center;
    color:var(--text-1);
  }
  .brand-row{ display:flex; align-items:center; gap:8px; font-size:17px; font-weight:700; }
  .brand-row .flame{ color:var(--brand); }
  .cart-btn{ position:relative; }
  .cart-badge{
    position:absolute; top:-4px; right:-4px;
    background:var(--brand); color:#fff; font-size:10px; font-weight:700;
    width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .navbar-right{ display:flex; align-items:center; gap:8px; }

  /* ---------- progress ---------- */
  .progress-track{
    height:3px; background:var(--bg-2); border-radius:3px;
    margin:14px 24px 4px; overflow:hidden;
  }
  .progress-fill{ height:100%; width:50%; background:var(--brand); border-radius:3px; }
  .progress-label{
    font-size:12px; color:var(--text-2); font-weight:600;
    margin:8px 24px 0;
  }

  .content{ flex:1; padding:8px 20px 24px; display:flex; flex-direction:column; }

  /* ---------- header ---------- */
  .form-header{ text-align:center; padding:14px 0 20px; }
  .mark{
    width:56px;height:56px;border-radius:16px;
    background:var(--brand-dim);
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 14px;
    color:var(--brand);
  }
  .form-header h1{ margin:0; font-size:24px; font-weight:750; letter-spacing:-.3px; }
  .form-header p{ margin:6px 0 0; font-size:14px; color:var(--text-2); }

  /* ---------- segmented control ---------- */
  .segment{
    display:flex; background:var(--bg-1); border:1px solid var(--sep);
    border-radius:12px; padding:3px; margin-bottom:22px;
    position:relative;
  }
  .segment button{
    flex:1; border:none; background:transparent; color:var(--text-2);
    font-size:14px; font-weight:600; padding:10px 0; border-radius:9px;
    font-family:inherit; cursor:pointer; position:relative; z-index:1;
    transition:color .2s;
  }
  .segment button.active{ color:var(--text-1); background:var(--bg-3); }

  /* ---------- fields ---------- */
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:12px; font-weight:700; letter-spacing:.4px;
    text-transform:uppercase; color:var(--text-3); margin-bottom:8px;
  }
  .field-box{
    display:flex; align-items:center; gap:10px;
    background:var(--bg-1); border:1px solid var(--sep); border-radius:14px;
    padding:14px 14px;
  }
  .field-box.focused{ border-color:var(--brand); }
  .field-box .prefix{ display:flex; align-items:center; gap:6px; color:var(--text-1); font-weight:600; font-size:15px; }
  .field-box input{
    flex:1; background:none; border:none; outline:none; color:var(--text-1);
    font-size:15px; font-weight:600; font-family:inherit; min-width:0;
  }
  .field-box input::placeholder{ color:var(--text-3); font-weight:500; }
  .field-box .icon{ color:var(--text-2); flex:0 0 auto; }
  .field-box .icon.toggle{ cursor:pointer; }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin:-6px 2px 20px;
  }
  .forgot{ font-size:13px; color:var(--brand); font-weight:600; }

  /* ---------- CTA ---------- */
  .cta{
    height:54px;
    background:var(--brand);
    border:none; border-radius:16px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    color:#fff; font-size:16px; font-weight:700;
    font-family:inherit; cursor:pointer;
    box-shadow: 0 10px 20px -8px rgba(255,68,56,.5);
    width:100%;
  }

  .guest-btn{
    height:50px; margin-top:10px;
    background:var(--bg-1); border:1px solid var(--sep); border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-1); font-size:15px; font-weight:600;
    font-family:inherit; cursor:pointer; width:100%;
  }

  .footnote{
    text-align:center; font-size:12px; color:var(--text-3); margin-top:auto; padding-top:24px;
  }
</style>
</head>
<body>

  <div class="screen">

    <div class="navbar">
      <div class="nav-btn" aria-label="Меню">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </div>
      <div class="brand-row"><span class="flame">🔥</span> Poytug GNS</div>
      <div class="navbar-right">
        <div class="nav-btn cart-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge">0</span>
        </div>
      </div>
    </div>

    <div class="progress-track"><div class="progress-fill"></div></div>
    <div class="progress-label">Шаг 1 из 2 · Данные</div>

    <div class="content">

      <div class="form-header">
        <div class="mark">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/></svg>
        </div>
        <h1>Вход в аккаунт</h1>
        <p>Введите номер телефона и пароль</p>
      </div>

      <div class="segment">
        <button class="active" type="button">Вход</button>
        <button type="button">Регистрация</button>
      </div>

      <form>
        <div class="field">
          <label>Номер телефона</label>
          <div class="field-box">
            <span class="prefix">🇺🇿 +998</span>
            <input type="tel" placeholder="90 123-45-67" inputmode="numeric">
          </div>
        </div>

        <div class="field">
          <label>Пароль</label>
          <div class="field-box">
            <span class="icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" placeholder="Введите пароль" value="123456">
            <span class="icon toggle">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
        </div>

        <div class="row-between">
          <span class="forgot">Забыли пароль?</span>
        </div>

        <button type="submit" class="cta">
          Продолжить к СМС коду
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>

        <button type="button" class="guest-btn">Продолжить без входа</button>
      </form>

      <p class="footnote">Нажимая «Продолжить», вы соглашаетесь с условиями использования</p>
    </div>
  </div>

</body>
</html>
