<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poytug GNS — Корзина</title>
<style>
  :root{
    --bg-0:#000000; --bg-1:#1C1C1E; --bg-2:#2C2C2E; --bg-3:#3A3A3C;
    --sep:rgba(255,255,255,.09);
    --text-1:#FFFFFF; --text-2:#98989F; --text-3:#636366;
    --brand:#FF4438; --brand-dim:rgba(255,68,56,.14);
  }
  *{box-sizing:border-box; -webkit-font-smoothing:antialiased;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(900px 500px at 30% 0%, #150f10, #000 60%);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    min-height:100vh; color:var(--text-1);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }

  .toggle-bar{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    display:flex; gap:6px; background:var(--bg-1); border:1px solid var(--sep);
    padding:4px; border-radius:11px; z-index:100;
  }
  .toggle-bar button{
    border:none; background:transparent; color:var(--text-2); font-family:inherit;
    font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer;
  }
  .toggle-bar button.active{ background:var(--bg-3); color:var(--text-1); }

  /* ---------- modal ---------- */
  .sheet{
    width:100%; max-width:400px;
    background:var(--bg-1); border:1px solid var(--sep);
    border-radius:26px; padding:26px 22px 22px;
    position:relative;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
  }
  .close-btn{
    position:absolute; top:16px; right:16px;
    width:30px;height:30px;border-radius:50%; background:var(--bg-2);
    display:flex;align-items:center;justify-content:center; color:var(--text-2);
  }

  .sheet-header{ text-align:center; padding:4px 0 20px; }
  .cart-mark{
    width:52px;height:52px;border-radius:16px; background:var(--brand-dim);
    display:flex;align-items:center;justify-content:center; margin:0 auto 12px; color:var(--brand);
  }
  .sheet-header h1{ margin:0; font-size:19px; font-weight:750; }

  /* ---------- filled state ---------- */
  .items{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bg-2); border-radius:14px; padding:12px 12px;
  }
  .item .name{ font-size:14px; font-weight:600; color:var(--text-1); flex:1; min-width:0; }
  .stepper{ display:flex; align-items:center; gap:0; background:var(--bg-3); border-radius:9px; overflow:hidden; }
  .stepper button{
    width:28px;height:28px; border:none; background:transparent; color:var(--text-1);
    font-size:16px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .stepper span{ width:22px; text-align:center; font-size:13px; font-weight:700; }
  .item .price{ font-size:14px; font-weight:700; color:var(--brand); width:88px; text-align:right; flex:0 0 auto; }

  /* ---------- empty state ---------- */
  .empty{
    display:none; flex-direction:column; align-items:center; text-align:center;
    padding:26px 10px 30px; color:var(--text-2);
  }
  .empty .ic{
    width:64px;height:64px;border-radius:18px; background:var(--bg-2);
    display:flex;align-items:center;justify-content:center; margin-bottom:14px; color:var(--text-3);
  }
  .empty h2{ margin:0; font-size:15px; font-weight:700; color:var(--text-1); }
  .empty p{ margin:6px 0 0; font-size:13px; max-width:220px; line-height:1.4; }

  /* ---------- promo ---------- */
  .promo-row{ display:flex; gap:8px; margin-bottom:18px; }
  .promo-input{
    flex:1; background:var(--bg-2); border:1px solid var(--sep); border-radius:12px;
    padding:12px 14px; color:var(--text-1); font-size:13.5px; font-family:inherit;
  }
  .promo-input::placeholder{ color:var(--text-3); }
  .promo-input:disabled{ opacity:.45; }
  .promo-apply{
    background:var(--bg-2); border:1px solid var(--sep); border-radius:12px;
    padding:0 16px; color:var(--brand); font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer;
  }
  .promo-apply:disabled{ color:var(--text-3); opacity:.6; }

  /* ---------- total ---------- */
  .total-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding:0 2px; }
  .total-row .l{ font-size:14px; font-weight:700; color:var(--brand); }
  .total-row .v{ font-size:19px; font-weight:800; color:var(--brand); }

  .cta{
    width:100%; height:54px; border:none; border-radius:16px;
    background:var(--brand); color:#fff; font-size:15.5px; font-weight:700; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer;
    box-shadow:0 10px 20px -8px rgba(255,68,56,.5);
  }
  .cta:disabled{ background:var(--bg-2); color:var(--text-3); box-shadow:none; cursor:default; }

  .browse-btn{
    width:100%; height:48px; margin-top:10px; border-radius:14px;
    background:var(--bg-2); border:1px solid var(--sep); color:var(--text-1);
    font-size:14px; font-weight:600; font-family:inherit; cursor:pointer;
    display:none; align-items:center; justify-content:center; gap:6px;
  }

  body.empty-mode .items{ display:none; }
  body.empty-mode .empty{ display:flex; }
  body.empty-mode .browse-btn{ display:flex; }
  body.empty-mode .promo-input,
  body.empty-mode .promo-apply,
  body.empty-mode .cta{ pointer-events:none; }
</style>
</head>
<body>

  <div class="toggle-bar">
    <button class="active" onclick="setMode(false, this)">С товарами</button>
    <button onclick="setMode(true, this)">Пустая</button>
  </div>

  <div class="sheet">
    <div class="close-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </div>

    <div class="sheet-header">
      <div class="cart-mark">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      </div>
      <h1>Корзина покупок</h1>
    </div>

    <div class="items">
      <div class="item">
        <span class="name">Баллон 10 кг</span>
        <div class="stepper"><button>−</button><span>1</span><button>+</button></div>
        <span class="price">340 000</span>
      </div>
      <div class="item">
        <span class="name">Баллон 20 кг</span>
        <div class="stepper"><button>−</button><span>1</span><button>+</button></div>
        <span class="price">480 000</span>
      </div>
    </div>

    <div class="empty">
      <div class="ic">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      </div>
      <h2>Корзина пуста</h2>
      <p>Добавьте баллон или аксессуар из каталога — и он появится здесь</p>
    </div>

    <div class="promo-row">
      <input class="promo-input" placeholder="Промокод (напр. GAS2026)">
      <button class="promo-apply">Применить</button>
    </div>

    <div class="total-row">
      <span class="l">Итого к оплате</span>
      <span class="v" id="total">820 000 UZS</span>
    </div>

    <button class="cta">
      Оформить покупку
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <button class="browse-btn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>
      Перейти в каталог баллонов
    </button>
  </div>

<script>
  function setMode(isEmpty, btn){
    document.body.classList.toggle('empty-mode', isEmpty);
    document.getElementById('total').textContent = isEmpty ? '0 UZS' : '820 000 UZS';
    document.querySelectorAll('.toggle-bar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.promo-input, .promo-apply').forEach(el=>el.disabled = isEmpty);
    document.querySelector('.cta').disabled = isEmpty;
  }
</script>
</body>
</html>
